<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahsa Ghorbani</title>
    <style>
      :root {
        --cream: #f4f1e8;
        --olive: #34412f;
        --sage: #87947c;
        --soft-sage: #cbd2c3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--olive);
        background: var(--cream);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        position: relative;
        min-height: 100vh;
        padding: 48px 24px;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      main::before,
      main::after {
        content: "";
        position: absolute;
        width: min(42vw, 520px);
        aspect-ratio: 1;
        border: 1px solid var(--soft-sage);
        border-radius: 50%;
        opacity: 0.58;
        pointer-events: none;
      }

      main::before {
        top: -25vw;
        right: -14vw;
      }

      main::after {
        bottom: -29vw;
        left: -16vw;
      }

      .intro {
        position: relative;
        z-index: 1;
        width: min(100%, 850px);
        text-align: center;
      }

      .intro::before {
        content: "";
        width: 42px;
        height: 1px;
        margin: 0 auto 38px;
        display: block;
        background: var(--sage);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(54px, 9vw, 108px);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 690px;
        margin: 40px auto 0;
        color: var(--sage);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(19px, 2.4vw, 27px);
        line-height: 1.65;
      }

      @media (max-width: 600px) {
        main {
          padding: 40px 22px;
        }

        main::before,
        main::after {
          width: 70vw;
        }

        main::before {
          top: -28vw;
          right: -35vw;
        }

        main::after {
          bottom: -35vw;
          left: -38vw;
        }

        .intro::before {
          margin-bottom: 30px;
        }

        h1 {
          font-size: clamp(50px, 17vw, 76px);
        }

        p {
          margin-top: 30px;
          font-size: 19px;
          line-height: 1.58;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="name">
        <h1 id="name">Mahsa Ghorbani</h1>
        <p>
          I'm Mahsa, a tech enthusiast with a curious mind. I teach machines to understand human
          logic and turn the real world into zeros and ones.
        </p>
      </section>
    </main>
  </body>
</html>
